name: "nix build check"
on:
  workflow_dispatch:
  push:
    branches: [main, nix/darwin]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - ".nix/**"
      - "bun.lock"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/nix-check.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - ".nix/**"
      - "bun.lock"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/nix-check.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate every supported package and development shell
        run: |
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            nix eval --raw ".#packages.$system.handy.drvPath"
            nix eval --raw ".#devShells.$system.default.drvPath"
          done
      - name: Build native Handy package
        run: nix build ".#packages.${{ matrix.system }}.handy" -L --show-trace
      - name: Verify macOS bundle and CLI
        if: runner.os == 'macOS'
        run: |
          test -x result/Applications/Handy.app/Contents/MacOS/handy
          test -L result/bin/handy
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' result/Applications/Handy.app/Contents/Info.plist
          result/bin/handy --help
      - name: Verify Linux CLI
        if: runner.os == 'Linux'
        run: result/bin/handy --help
