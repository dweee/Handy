name: Sync and test upstream
"on":
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [upstream-updated]
permissions: {}
jobs:
  upstream:
    if: ${{ vars.GUARDED_UPSTREAM_SYNC_ENABLED == 'true' }}
    permissions:
      statuses: write
      id-token: write
      contents: write
      actions: write
      checks: read
    uses: dweee/dave-fork-ci/.github/workflows/upstream-sync.yml@6b52aa63a778f2d9732ab47e218344a62d11048b
    with:
      tool-repository: dweee/dave-fork-ci
      tool-revision: 6b52aa63a778f2d9732ab47e218344a62d11048b
      auto-merge: ${{ vars.FORK_CI_AUTO_MERGE == 'true' && (vars.NIKS3_PUSH_ENABLED || vars.ATTIC_PUSH_ENABLED) == 'true' }}
      cache: true
      max-closure-mib: 8192
